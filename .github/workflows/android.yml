name: Build Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Bundle backend and frontend into Android app
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/frontend
          cp -r frontend android/app/src/main/assets/

          mkdir -p android/app/src/main/python
          rm -rf android/app/src/main/python/backend android/app/src/main/python/frontend
          cp -r backend android/app/src/main/python/
          cp -r frontend android/app/src/main/python/
          rm -f android/app/src/main/python/backend/*.db android/app/src/main/python/backend/*.env
          rm -rf android/app/src/main/python/backend/__pycache__ android/app/src/main/python/backend/*/__pycache__

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tatap-Android-Debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
