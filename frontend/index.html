<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tatap — nonton santai di lokal</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230e7490'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='monospace'>T</text></svg>">
</head>
<body>
<div id="crt" aria-hidden="true"></div>
<div id="bg-glow" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand" id="brand-home" title="Home">
    <span class="brand-mark">▶</span>
    <span class="brand-name">TATAP</span>
    <span class="brand-tag">lokal</span>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="q" placeholder="Cari anime…  (cth: frieren, solo leveling)" autocomplete="off" spellcheck="false">
    <button id="q-clear" class="icon-btn hidden" title="Bersihkan">✕</button>
    <kbd>/</kbd>
  </div>
  <div class="top-actions">
    <label class="switch" title="Efek CRT scanlines"><input type="checkbox" id="tgl-crt" checked><span class="sw"></span>CRT</label>
    <label class="switch" title="Ambient light di belakang player"><input type="checkbox" id="tgl-ambient" checked><span class="sw"></span>AMBIENT</label>
    <span id="health" class="health" title="Status hianime.at">…</span>
  </div>
</header>

<main>
  <section id="continue-sec" class="hidden">
    <div class="sec-head"><h2>Lanjutkan menonton</h2><button class="link-btn" id="clear-hist">hapus</button></div>
    <div id="continue-row" class="hscroll"></div>
  </section>

  <section id="search-sec">
    <div class="sec-head">
      <h2 id="results-title">Mulai pencarian di atas</h2>
      <span id="results-meta" class="dim"></span>
    </div>
    <div id="recent-chips" class="chips"></div>
    <div id="results" class="grid"></div>
    <div id="empty-state" class="empty">
      <div class="empty-art">[ ]</div>
      <p>Ketik judul anime lalu tekan <b>Enter</b>.<br><span class="dim">Navigasi: ↑ ↓ pilih · Enter buka · Esc tutup</span></p>
    </div>
  </section>
</main>

<!-- TITLE / EPISODE MODAL -->
<div id="title-modal" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="sheet-head">
      <div>
        <div class="eyebrow" id="tm-eyebrow">DETAIL ANIME</div>
        <h2 id="tm-title">–</h2>
        <div class="dim small" id="tm-sub">–</div>
      </div>
      <button class="icon-btn big" id="tm-close" title="Tutup (Esc)">✕</button>
    </div>
    <div class="sheet-controls">
      <div class="seg" id="mode-seg">
        <button data-mode="sub" class="active">SUB</button><button data-mode="dub">DUB</button>
      </div>
      <div class="seg" id="quality-seg">
        <button data-q="best" class="active">BEST</button><button data-q="1080p">1080p</button><button data-q="720p">720p</button><button data-q="480p">480p</button>
      </div>
      <input id="ep-filter" placeholder="Filter ep… cth: 12" inputmode="numeric">
      <span id="tm-count" class="dim small"></span>
    </div>
    <div id="tm-eps" class="ep-grid"></div>
  </div>
</div>

<!-- PLAYER MODAL -->
<div id="player-modal" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="player-shell">
    <div class="player-head">
      <div class="player-title"><span id="pm-title">–</span><span id="pm-meta" class="dim"></span></div>
      <div class="player-head-btns">
        <button id="pm-mpv" title="Putar di MPV (lokal)">▷ MPV</button>
        <button id="pm-close" class="icon-btn big" title="Tutup (Esc)">✕</button>
      </div>
    </div>
    <div class="ambient-stage">
      <div id="ambient-fallback" aria-hidden="true"></div>
      <canvas id="ambient" width="96" height="54" aria-hidden="true"></canvas>
      <video id="vid" controls playsinline preload="auto"></video>
      <div id="pm-spinner" class="spinner hidden"><div class="ring"></div><p id="pm-status">resolving…</p></div>
    </div>
    <div class="player-foot">
      <button id="pm-prev" title="Episode sebelumnya (p)">⏮ PREV</button>
      <div id="pm-variants" class="variants"></div>
      <button id="pm-next" title="Episode berikutnya (n)">NEXT ⏭</button>
    </div>
    <div class="player-hint dim small">Space play/pause · ←/→ seek 5 dtk · n/p ganti episode · m mute · Esc tutup</div>
  </div>
</div>

<div id="toast" class="toast hidden"><span id="toast-msg"></span></div>

<script src="/js/vendor/hls.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
